<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Security Guard Bill Generator - Generate professional security service bills instantly">
  <title>Security Guard Bill Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap"
    rel="stylesheet">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>

  <!-- ========== LOGIN SCREEN ========== -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <h2 class="login-title">Enter Password</h2>
      <p class="login-subtitle">Access is restricted</p>
      <div class="login-form">
        <input type="password" id="loginPassword" class="login-input" placeholder="Password" autocomplete="off">
        <div class="login-error" id="loginError">Incorrect password</div>
        <button class="login-btn" id="loginBtn" onclick="attemptLogin()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
            <polyline points="10 17 15 12 10 7" />
            <line x1="15" y1="12" x2="3" y2="12" />
          </svg>
          Unlock
        </button>
      </div>
    </div>
  </div>

  <!-- ========== FORM PANEL ========== -->
  <main class="app-container">
    <header class="app-header">
      <div class="logo-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
          <polyline points="10 9 9 9 8 9" />
        </svg>
      </div>
      <div>
        <h1>Bill Generator</h1>
        <p class="subtitle">Security Guard Services</p>
      </div>
    </header>

    <section class="form-section">
      <!-- Name Selection -->
      <div class="form-group">
        <label class="form-label">Select Name</label>
        <div class="name-chips" id="nameChips">
          <button class="chip active" data-name="SANJAY SORATHIYA" id="chipSanjay">Sanjay Sorathiya</button>
          <button class="chip" data-name="FIROZ BHARKHANI" id="chipFiroz">Firoz Bharkhani</button>
          <button class="chip" data-name="JAVED HANIFBHAI" id="chipJaved">Javed HANIFBHAI</button>
          <button class="chip" data-name="BHARKHANI FENISH FIROZBHAI" id="chipFenish">Bharkhani Fenish Firozbhai</button>
        </div>
      </div>

      <!-- Company Name -->
      <div class="form-group">
        <label class="form-label" for="companyName">Company Name (MS.)</label>
        <input type="text" id="companyName" class="form-input" placeholder="Enter company name..." autocomplete="off">
      </div>

      <!-- Date & Month Row -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="billDate">Date</label>
          <input type="date" id="billDate" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="billMonth">Bill of the Month</label>
          <select id="billMonth" class="form-input">
            <option value="">Select Month</option>
            <option value="JANUARY">January</option>
            <option value="FEBRUARY">February</option>
            <option value="MARCH">March</option>
            <option value="APRIL">April</option>
            <option value="MAY">May</option>
            <option value="JUNE">June</option>
            <option value="JULY">July</option>
            <option value="AUGUST">August</option>
            <option value="SEPTEMBER">September</option>
            <option value="OCTOBER">October</option>
            <option value="NOVEMBER">November</option>
            <option value="DECEMBER">December</option>
          </select>
        </div>
      </div>

      <!-- Security Guard Details -->
      <div class="form-group">
        <label class="form-label">Security Guard Details</label>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label-small" for="guardQty">Quantity</label>
            <input type="number" id="guardQty" class="form-input" placeholder="Qty" min="0" value="">
          </div>
          <div class="form-group">
            <label class="form-label-small" for="guardRate">Rate (₹)</label>
            <input type="number" id="guardRate" class="form-input" placeholder="Rate" min="0" value="">
          </div>
        </div>
      </div>

      <!-- Bouncer Details -->
      <div class="form-group">
        <label class="form-label">Bouncer Details</label>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label-small" for="bouncerQty">Quantity</label>
            <input type="number" id="bouncerQty" class="form-input" placeholder="Qty" min="0" value="">
          </div>
          <div class="form-group">
            <label class="form-label-small" for="bouncerRate">Rate (₹)</label>
            <input type="number" id="bouncerRate" class="form-input" placeholder="Rate" min="0" value="">
          </div>
        </div>
      </div>

      <!-- Remarks -->
      <div class="form-group">
        <label class="form-label" for="remarks">Remarks</label>
        <input type="text" id="remarks" class="form-input" placeholder="Optional remarks...">
      </div>

      <!-- Signature Option -->
      <div class="form-group">
        <label class="checkbox-card" for="includeSign">
          <input type="checkbox" id="includeSign">
          <div class="custom-check">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
          <div class="checkbox-label-group">
            <span class="checkbox-main">Add Signature</span>
            <span class="checkbox-sub">Display authorised sign on bill</span>
          </div>
        </label>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn btn-preview" id="btnPreview" onclick="updatePreview()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          Preview
        </button>
        <button class="btn btn-print" id="btnPrint" onclick="printBill()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9" />
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <rect x="6" y="14" width="12" height="8" />
          </svg>
          Print
        </button>
        <button class="btn btn-download" id="btnDownload" onclick="downloadBill()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Download
        </button>
      </div>
    </section>
  </main>

  <!-- ========== BILL PREVIEW (visible on screen) ========== -->
  <div class="preview-panel" id="previewPanel">
    <div class="preview-header">
      <h2>Bill Preview</h2>
      <span class="preview-badge">Live Preview</span>
    </div>
    <div class="preview-scroll">
      <div class="bill-page" id="billPreview">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <!-- ========== PRINT-ONLY BILL ========== -->
  <div id="printArea">
    <div class="bill-page" id="billPrint">
      <!-- Filled by JS on print -->
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>

</html>
